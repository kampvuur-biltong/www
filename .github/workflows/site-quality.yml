name: Site Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Responsive and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start static site
        run: |
          node tests/static_server.mjs > /tmp/kampvuur-site.log 2>&1 &
          echo $! > /tmp/kampvuur-site.pid

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Kampvuur test server ready"
              exit 0
            fi
            sleep 1
          done

          echo "Static server failed to start"
          cat /tmp/kampvuur-site.log || true
          exit 1

      - name: Responsive and UI interaction tests
        run: python tests/ui_test.py

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/kampvuur-site.log || true